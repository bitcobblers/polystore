name: CICD
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    env:
      DOTNET_NOLOGO: true
      logger: GitHubActions;report-warnings=false
      results-directory: ${{ github.workspace }}/Artifacts/TestResults
      collect: "XPlat Code Coverage"

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        config: [Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore Packages
        run: dotnet restore

      - name: Check Formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Build Solution
        run: dotnet build --no-restore --configuration ${{ matrix.config }}

      - name: Run Tests
        run: dotnet test --no-restore --configuration ${{ matrix.config }} --collect:"${{ env.collect }}" --logger:"${{ env.logger }}" --results-directory:"${{ env.results-directory }}"

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test]
    env:
      DOTNET_NOLOGO: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install NPM Dependencies
        run: |
          npm ci
          npm audit signatures

      - name: Restore Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-restore --configuration Release

      - name: Generate Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          npx semantic-release
